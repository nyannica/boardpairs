<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Studio Duo | Real-Time</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --bg-base: #fcfcfc;
  --surface: rgba(255,255,255,0.85);
  --accent: #111;
  --text-main: #222;
  --border: rgba(0,0,0,0.08);
  --shadow: 0 4px 20px rgba(0,0,0,0.05);
}

body, html {
  margin:0;
  padding:0;
  height:100%;
  width:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Inter",sans-serif;
  background:var(--bg-base);
  overflow:hidden;
  touch-action:none;
}

#gate {
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:6000;
}

.gate-input {
  border:none;
  border-bottom:2px solid var(--border);
  font-size:20px;
  text-align:center;
  letter-spacing:8px;
  width:220px;
  margin-bottom:20px;
}

.gate-btn {
  background:var(--accent);
  color:white;
  border:none;
  padding:12px 32px;
  cursor:pointer;
}

#drawing-canvas {
  position:absolute;
  inset:0;
  pointer-events:none;
}

#drawing-canvas.active {
  pointer-events:auto;
  cursor:crosshair;
}

#desktop {
  width:100vw;
  height:100vh;
  display:none;
  position:relative;
}

#taskbar {
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  background:var(--surface);
  padding:10px 20px;
  border-radius:12px;
  display:flex;
  gap:15px;
  align-items:center;
  box-shadow:var(--shadow);
}

.item {
  position:absolute;
  min-width:50px;
  min-height:50px;
  cursor:grab;
}

.item-box {
  background:var(--surface);
  padding:32px 14px 14px;
  border-radius:8px;
  resize:both;
  overflow:hidden;
  box-shadow:var(--shadow);
}

.item textarea {
  width:100%;
  height:140px;
  border:none;
  background:transparent;
  resize:none;
}

.palette {
  display:flex;
  gap:6px;
}

.swatch {
  width:16px;
  height:16px;
  border-radius:50%;
  cursor:pointer;
  border:1px solid rgba(0,0,0,0.1);
}

.swatch.active {
  transform:scale(1.3);
  border:1px solid var(--accent);
}

#sync-indicator {
  font-size:9px;
  color:#2a9d8f;
  font-weight:bold;
  opacity:0;
}
</style>
</head>

<body>

<div id="gate">
  <div>
    <input type="password" id="accessCode" class="gate-input" placeholder="PASSKEY">
    <button class="gate-btn" onclick="unlock()">Enter</button>
  </div>
</div>

<canvas id="drawing-canvas"></canvas>

<div id="desktop">
  <div id="taskbar">
    <button onclick="addItem('text')">Text</button>
    <button onclick="document.getElementById('fileUp').click()">Media</button>
    <button onclick="document.getElementById('bgUp').click()">BG</button>
    <button onclick="clearBackground()">Clear BG</button>
    <button id="drawBtn" onclick="toggleMode('draw')">Draw</button>
    <button id="eraseBtn" onclick="toggleMode('erase')">Erase</button>

    <div class="palette">
      <div class="swatch active" style="background:#111" data-color="#111"></div>
      <div class="swatch" style="background:#e63946" data-color="#e63946"></div>
      <div class="swatch" style="background:#457b9d" data-color="#457b9d"></div>
    </div>

    <input type="file" id="fileUp" hidden accept="image/*,video/*" onchange="uploadMedia(this)">
    <input type="file" id="bgUp" hidden accept="image/*" onchange="uploadBackground(this)">
    <span id="sync-indicator">LIVE</span>
  </div>
</div>

<script>
const SB_URL="https://djpcwjjjjwbpsvuqmxxt.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqcGN3ampqandicHN2dXFteHh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExNzM4MzMsImV4cCI6MjA4Njc0OTgzM30.jSRjuVf2tcGHg1QceEquaE146e2FNaoNBnyjJ36_IZI";
const supabase=window.supabase.createClient(SB_URL,SB_KEY);

let currentRoom="";
const canvas=document.getElementById("drawing-canvas");
const ctx=canvas.getContext("2d");

let isDrawing=false;
let activeMode=null;
let currentColor="#111";

function resizeCanvas(){
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
}

async function unlock(){
  const input=document.getElementById("accessCode").value.trim();
  if(!input)return;

  currentRoom=input;
  document.getElementById("gate").style.display="none";
  document.getElementById("desktop").style.display="block";
  resizeCanvas();

  supabase.channel("room-"+currentRoom)
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"studio_duo",filter:`id=eq.${currentRoom}`},
      payload=>renderFromData(payload.new.data))
    .subscribe();

  const {data,error}=await supabase
    .from("studio_duo")
    .select("data")
    .eq("id",currentRoom)
    .maybeSingle();

  if(error){console.error(error);return;}

  if(data)renderFromData(data.data);
  else{
    await supabase.from("studio_duo").insert([
      {id:currentRoom,data:{items:[],draw:"",bg:""}}
    ]);
  }
}

async function pushToCloud(){
  if(!currentRoom)return;
  const items=[];
  document.querySelectorAll(".item").forEach(el=>{
    const c=el.querySelector(".content");
    items.push({
      type:el.dataset.type,
      val:el.dataset.type==="text"?c.value:c.src,
      x:el.style.left,
      y:el.style.top,
      w:el.style.width,
      h:el.style.height
    });
  });

  const state={
    items,
    draw:canvas.toDataURL(),
    bg:document.body.style.backgroundImage
  };

  await supabase.from("studio_duo").update({data:state}).eq("id",currentRoom);
}

function renderFromData(data){
  if(!data||isDrawing)return;

  document.querySelectorAll(".item").forEach(i=>i.remove());
  data.items.forEach(d=>addItem(d.type,d.val,d.x,d.y,d.w,d.h,true,true));

  if(data.draw){
    const img=new Image();
    img.onload=()=>{
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img,0,0);
    };
    img.src=data.draw;
  }

  if(data.bg)document.body.style.backgroundImage=data.bg;
}

function toggleMode(mode){
  activeMode=activeMode===mode?null:mode;
  canvas.classList.toggle("active",!!activeMode);
}

function addItem(type,val="",x="100px",y="120px",w="auto",h="auto",_,isLoading=false){
  const div=document.createElement("div");
  div.className="item item-box";
  div.dataset.type=type;
  div.style.left=x;
  div.style.top=y;
  div.style.width=w;
  div.style.height=h;

  const content=document.createElement(type==="text"?"textarea":"img");
  content.className="content";
  if(type==="text"){
    content.value=val;
    content.onblur=pushToCloud;
  }else{
    content.src=val;
  }

  div.appendChild(content);
  makeDraggable(div);
  document.getElementById("desktop").appendChild(div);

  if(!isLoading)pushToCloud();
}

function makeDraggable(el){
  el.onmousedown=e=>{
    let x=e.clientX,y=e.clientY;
    document.onmousemove=e2=>{
      el.style.left=el.offsetLeft+(e2.clientX-x)+"px";
      el.style.top=el.offsetTop+(e2.clientY-y)+"px";
      x=e2.clientX;y=e2.clientY;
    };
    document.onmouseup=()=>{
      document.onmousemove=null;
      pushToCloud();
    };
  };
}

function clearBackground(){
  document.body.style.backgroundImage="none";
  pushToCloud();
}

function uploadMedia(input){
  const file=input.files[0];
  const reader=new FileReader();
  reader.onload=e=>addItem("image",e.target.result);
  reader.readAsDataURL(file);
}

function uploadBackground(input){
  const reader=new FileReader();
  reader.onload=e=>{
    document.body.style.backgroundImage=`url('${e.target.result}')`;
    pushToCloud();
  };
  reader.readAsDataURL(input.files[0]);
}

canvas.onpointerdown=e=>{
  if(!activeMode)return;
  isDrawing=true;
  ctx.beginPath();
  ctx.moveTo(e.clientX,e.clientY);
};

canvas.onpointermove=e=>{
  if(!isDrawing)return;
  ctx.lineTo(e.clientX,e.clientY);
  ctx.lineWidth=activeMode==="erase"?40:10;
  ctx.globalCompositeOperation=
    activeMode==="erase"?"destination-out":"source-over";
  ctx.strokeStyle=currentColor;
  ctx.stroke();
};

window.onpointerup=()=>{
  if(isDrawing){
    isDrawing=false;
    pushToCloud();
  }
};

document.querySelectorAll(".swatch").forEach(s=>{
  s.onclick=()=>{
    document.querySelectorAll(".swatch").forEach(sw=>sw.classList.remove("active"));
    s.classList.add("active");
    currentColor=s.dataset.color;
    toggleMode("draw");
  };
});

resizeCanvas();
window.onresize=resizeCanvas;
</script>

</body>
</html>
