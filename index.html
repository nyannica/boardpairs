<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Studio Duo | High Performance</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-base: #fcfcfc;
            --surface: rgba(255, 255, 255, 0.9);
            --accent: #111111;
            --text-main: #222222;
            --border: rgba(0, 0, 0, 0.1);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main); overflow: auto; touch-action: none;
        }

        #viewport {
            width: 300vw; height: 300vh;
            transform-origin: 0 0;
            transition: transform 0.1s linear;
            position: relative;
            background-image: radial-gradient(var(--border) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        #gate { position: fixed; inset: 0; background: var(--bg-base); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9000; }
        .gate-input { background: transparent; border: none; border-bottom: 2px solid var(--border); color: var(--text-main); font-size: 20px; text-align: center; outline: none; padding: 10px; letter-spacing: 8px; width: 220px; margin-bottom: 20px; }
        .gate-btn { background: var(--accent); color: white; border: none; padding: 12px 32px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; border-radius: 4px; }

        #drawing-canvas { position: absolute; top: 0; left: 0; z-index: 1; pointer-events: none; }
        #drawing-canvas.active { pointer-events: all; cursor: crosshair; z-index: 5; }
        #viewport.pan-active { cursor: grab; }
        #viewport.pan-active:active { cursor: grabbing; }

        #desktop { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 10; pointer-events: none; }
        
        #taskbar {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: var(--surface); backdrop-filter: blur(20px);
            padding: 10px 24px; border-radius: 12px;
            display: flex; gap: 12px; align-items: center;
            border: 1px solid var(--border); z-index: 8000; box-shadow: var(--shadow);
            pointer-events: all;
        }

        .tool-btn { background: transparent; border: none; color: var(--text-main); padding: 6px 8px; cursor: pointer; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.5; font-weight: 500; }
        .tool-btn.active { opacity: 1; border-bottom: 2px solid var(--accent); }

        .item { position: absolute; min-width: 150px; min-height: 100px; z-index: 100; pointer-events: all; display: flex; flex-direction: column; box-shadow: var(--shadow); border-radius: 8px; background: var(--surface); border: 1px solid var(--border); overflow: hidden; }
        .drag-handle { height: 28px; width: 100%; background: rgba(0,0,0,0.04); cursor: move; display: flex; align-items: center; justify-content: center; }
        .resizer { width: 16px; height: 16px; position: absolute; right: 0; bottom: 0; cursor: nwse-resize; z-index: 110; }
        .content-wrap { flex-grow: 1; position: relative; width: 100%; height: 100%; overflow: hidden; display: flex;}
        .item textarea { width: 100%; height: 100%; border: none; resize: none; outline: none; background: transparent; padding: 10px; box-sizing: border-box; font-family: inherit; font-size: 14px; }
        .item img, .item video { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
        .close-btn { position: absolute; top: 6px; right: 8px; border: none; background: #ff5f56; width: 12px; height: 12px; border-radius: 50%; cursor: pointer; z-index: 120; }

        #colorWheel { width: 24px; height: 24px; border: none; padding: 0; background: none; cursor: pointer; border-radius: 50%; }
        .size-slider { width: 60px; height: 4px; cursor: pointer; accent-color: var(--accent); }
        #zoom-indicator { font-size: 10px; font-weight: 800; min-width: 35px; text-align: center; }
    </style>
</head>
<body>

    <div id="gate">
        <input type="password" id="accessCode" class="gate-input" placeholder="PASSKEY" onkeypress="if(event.key === 'Enter') unlock()">
        <button class="gate-btn" onclick="unlock()">Enter</button>
    </div>

    <div id="viewport">
        <canvas id="drawing-canvas"></canvas>
        <div id="desktop"></div>
    </div>

    <div id="taskbar">
        <button class="tool-btn" onclick="addItem('text')">Text</button>
        <button class="tool-btn" onclick="document.getElementById('fileUp').click()">Media</button>
        
        <div style="border-left: 1px solid var(--border); padding-left: 10px; display: flex; gap: 5px; align-items: center;">
            <button class="tool-btn" onclick="document.getElementById('bgUp').click()">BG</button>
            <button class="tool-btn" onclick="removeBackground()" style="font-size: 8px; color: #888;">RMV</button>
        </div>

        <div style="border-left: 1px solid var(--border); padding-left: 10px; display: flex; gap: 4px; align-items: center;">
            <button class="tool-btn" onclick="changeZoom(-0.25)">-</button>
            <span id="zoom-indicator">100%</span>
            <button class="tool-btn" onclick="changeZoom(0.25)">+</button>
            <button class="tool-btn" onclick="toggleMode('pan')" id="panBtn">🖐</button>
        </div>
        
        <div style="border-left: 1px solid var(--border); padding-left: 10px; display: flex; gap: 8px; align-items: center;">
            <button class="tool-btn" onclick="toggleMode('draw')" id="drawBtn">Draw</button>
            <button class="tool-btn" onclick="toggleMode('erase')" id="eraseBtn">Erase</button>
            <input type="color" id="colorWheel" value="#111111" onchange="currentColor = this.value">
            <input type="range" class="size-slider" id="brushSize" min="1" max="50" value="3">
            <label style="display:flex; align-items:center; gap:4px; cursor:pointer;">
                <input type="checkbox" id="pressureToggle">
                <span style="font-size: 9px; font-weight: 700;">PRESS</span>
            </label>
        </div>

        <div style="border-left: 1px solid var(--border); padding-left: 10px; display: flex; gap: 5px;">
            <button class="tool-btn" onclick="undo()">⟲</button>
            <button class="tool-btn" onclick="redo()">⟳</button>
        </div>

        <button class="tool-btn" onclick="clearAll()" style="color:red; border-left: 1px solid var(--border); padding-left:10px;">Reset</button>
        
        <input type="file" id="fileUp" hidden onchange="uploadMedia(this)">
        <input type="file" id="bgUp" hidden onchange="uploadBackground(this)">
    </div>

    <script>
        const SUPABASE_URL = 'https://djpcwjjjjwbpsvuqmxxt.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqcGN3ampqandicHN2dXFteHh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExNzM4MzMsImV4cCI6MjA4Njc0OTgzM30.jSRjuVf2tcGHg1QceEquaE146e2FNaoNBnyjJ36_IZI';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentCode = "";
        let currentScale = 1;
        const viewport = document.getElementById('viewport');
        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d');
        const sizeInput = document.getElementById('brushSize');
        
        let isDrawing = false, isPanning = false;
        let activeMode = null;
        let currentColor = "#111111";
        let lastX = 0, lastY = 0;
        let startX, startY, scrollLeft, scrollTop;
        let history = [], redoStack = [];

        window.unlock = async function() {
            const input = document.getElementById('accessCode').value;
            if (input.length < 2) return;
            currentCode = `studio_${input}`;
            document.getElementById('gate').style.display = "none";
            resizeCanvas();
            initialLoad();
            subscribeToChanges();
        };

        window.changeZoom = function(delta) {
            currentScale = Math.min(Math.max(0.25, currentScale + delta), 3);
            viewport.style.transform = `scale(${currentScale})`;
            document.getElementById('zoom-indicator').innerText = Math.round(currentScale * 100) + "%";
        };

        function resizeCanvas() {
            const temp = canvas.toDataURL();
            canvas.width = window.innerWidth * 3;
            canvas.height = window.innerHeight * 3;
            const img = new Image();
            img.onload = () => ctx.drawImage(img, 0, 0);
            img.src = temp;
        }

        function subscribeToChanges() {
            sb.channel('studio_realtime')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'studio_sessions', filter: `id=eq.${currentCode}` }, 
                payload => {
                    renderItems(payload.new.data);
                    renderDrawing(payload.new.drawing);
                    if (payload.new.background) viewport.style.backgroundImage = `url(${payload.new.background})`;
                }).subscribe();
        }

        window.pushUpdate = async function() {
            if (!currentCode) return;
            const items = [];
            document.querySelectorAll('.item').forEach(el => {
                const type = el.querySelector('img') ? 'image' : el.querySelector('video') ? 'video' : 'text';
                items.push({
                    type, x: parseInt(el.style.left), y: parseInt(el.style.top),
                    w: parseInt(el.style.width), h: parseInt(el.style.height),
                    val: type === 'text' ? el.querySelector('textarea').value : el.querySelector('img, video').src
                });
            });
            // Optimization: WebP compression for database
            const drawingData = canvas.toDataURL("image/webp", 0.4);
            const bgData = viewport.style.backgroundImage.replace(/url\(['"]?(.*?)['"]?\)/, '$1');

            await sb.from('studio_sessions').upsert({ id: currentCode, data: items, drawing: drawingData, background: bgData });
        };

        async function initialLoad() {
            const { data } = await sb.from('studio_sessions').select('*').eq('id', currentCode).single();
            if (data) { 
                renderItems(data.data); 
                renderDrawing(data.drawing); 
                if (data.background) viewport.style.backgroundImage = `url(${data.background})`;
                history = [data.drawing || canvas.toDataURL()]; 
            }
        }

        function renderItems(items) {
            if (!items) return;
            document.querySelectorAll('.item').forEach(el => el.remove());
            items.forEach(i => addItem(i.type, i.val, i.x, i.y, i.w, i.h, false));
        }

        function renderDrawing(drawData) {
            if (!drawData) return;
            const img = new Image();
            img.onload = () => { ctx.clearRect(0,0,canvas.width, canvas.height); ctx.drawImage(img, 0, 0); };
            img.src = drawData;
        }

        window.removeBackground = function() { viewport.style.backgroundImage = ''; pushUpdate(); };

        window.toggleMode = function(mode) {
            activeMode = (activeMode === mode) ? null : mode;
            canvas.classList.toggle('active', activeMode === 'draw' || activeMode === 'erase');
            viewport.classList.toggle('pan-active', activeMode === 'pan');
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            if (activeMode) document.getElementById(activeMode + 'Btn').classList.add('active');
        };

        // --- PANNING ---
        window.addEventListener('mousedown', (e) => {
            if (activeMode !== 'pan') return;
            isPanning = true;
            startX = e.pageX - document.body.offsetLeft;
            startY = e.pageY - document.body.offsetTop;
            scrollLeft = document.body.scrollLeft;
            scrollTop = document.body.scrollTop;
        });
        window.addEventListener('mousemove', (e) => {
            if (!isPanning) return;
            document.body.scrollLeft = scrollLeft - (e.pageX - document.body.offsetLeft - startX);
            document.body.scrollTop = scrollTop - (e.pageY - document.body.offsetTop - startY);
        });
        window.addEventListener('mouseup', () => isPanning = false);

        // --- OPTIMIZED DRAWING ---
        canvas.onpointerdown = (e) => { 
            if (activeMode !== 'draw' && activeMode !== 'erase') return;
            isDrawing = true; 
            lastX = e.offsetX; lastY = e.offsetY;
            redoStack = [];
        };

        canvas.onpointermove = (e) => {
            if (!isDrawing) return;
            requestAnimationFrame(() => {
                if (!isDrawing) return;
                const currX = e.offsetX; const currY = e.offsetY;
                ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(currX, currY);
                const size = parseInt(sizeInput.value);
                const pressure = document.getElementById('pressureToggle').checked ? (e.pressure || 0.5) : 1;
                ctx.lineWidth = (activeMode === 'erase' ? size * 2 : size) * pressure;
                ctx.lineCap = "round"; ctx.lineJoin = "round";
                ctx.strokeStyle = currentColor;
                ctx.globalCompositeOperation = activeMode === 'erase' ? "destination-out" : "source-over";
                ctx.stroke(); 
                [lastX, lastY] = [currX, currY];
            });
        };

        canvas.onpointerup = () => { 
            if (!isDrawing) return; 
            isDrawing = false; 
            history.push(canvas.toDataURL("image/webp", 0.4));
            if (history.length > 25) history.shift();
            pushUpdate(); 
        };

        window.addItem = function(type, val = '', x = 100, y = 100, w = 300, h = 200, shouldPush = true) {
            const div = document.createElement('div');
            div.className = 'item'; div.style.left = x + 'px'; div.style.top = y + 'px'; div.style.width = w + 'px'; div.style.height = h + 'px';
            const handle = document.createElement('div'); handle.className = 'drag-handle';
            const close = document.createElement('button'); close.className = 'close-btn';
            close.onclick = () => { div.remove(); pushUpdate(); };
            const contentWrap = document.createElement('div'); contentWrap.className = 'content-wrap';
            let content = type === 'text' ? document.createElement('textarea') : document.createElement(type === 'video' ? 'video' : 'img');
            if (type === 'text') { content.value = val; content.onblur = pushUpdate; } else { content.src = val; if(type === 'video') content.controls = true; }
            const resizer = document.createElement('div'); resizer.className = 'resizer';
            contentWrap.appendChild(content); div.appendChild(handle); div.appendChild(close); div.appendChild(contentWrap); div.appendChild(resizer);
            document.getElementById('desktop').appendChild(div);
            setupInteraction(div, handle, resizer);
            if(shouldPush) pushUpdate();
        };

        function setupInteraction(item, handle, resizer) {
            handle.onpointerdown = (e) => {
                let sX = e.clientX - item.offsetLeft * currentScale, sY = e.clientY - item.offsetTop * currentScale;
                document.onpointermove = (m) => { 
                    item.style.left = ((m.clientX - sX) / currentScale) + 'px'; 
                    item.style.top = ((m.clientY - sY) / currentScale) + 'px'; 
                };
                document.onpointerup = () => { document.onpointermove = null; pushUpdate(); };
            };
            resizer.onpointerdown = (e) => {
                e.preventDefault();
                let sW = item.offsetWidth, sH = item.offsetHeight, sX = e.clientX, sY = e.clientY;
                document.onpointermove = (m) => {
                    item.style.width = Math.max(100, (sW + (m.clientX - sX) / currentScale)) + 'px';
                    item.style.height = Math.max(80, (sH + (m.clientY - sY) / currentScale)) + 'px';
                };
                document.onpointerup = () => { document.onpointermove = null; pushUpdate(); };
            };
        }

        window.uploadMedia = function(input) {
            const file = input.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => addItem(file.type.startsWith('image') ? 'image' : 'video', e.target.result);
            reader.readAsDataURL(file);
        };

        window.uploadBackground = function(input) {
            const file = input.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => { viewport.style.backgroundImage = `url('${e.target.result}')`; pushUpdate(); };
            reader.readAsDataURL(file);
        };

        window.clearAll = async function() { if(confirm("Erase Everything?")) { await sb.from('studio_sessions').delete().eq('id', currentCode); location.reload(); } };
        window.undo = function() { if (history.length <= 1) return; redoStack.push(history.pop()); renderDrawing(history[history.length - 1]); pushUpdate(); };
        window.redo = function() { if (redoStack.length === 0) return; const state = redoStack.pop(); history.push(state); renderDrawing(state); pushUpdate(); };
        window.onresize = resizeCanvas;
    </script>
</body>
</html>
