<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Studio Duo | Advanced Live</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-base: #fcfcfc;
            --surface: rgba(255, 255, 255, 0.9);
            --accent: #111111;
            --text-main: #222222;
            --border: rgba(0, 0, 0, 0.1);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
            background-color: var(--bg-base); background-size: cover; background-position: center;
            color: var(--text-main); overflow: hidden; touch-action: none;
            transition: background 0.3s ease;
        }

        #gate { position: fixed; inset: 0; background: var(--bg-base); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9000; }
        .gate-input { background: transparent; border: none; border-bottom: 2px solid var(--border); color: var(--text-main); font-size: 20px; text-align: center; outline: none; padding: 10px; letter-spacing: 8px; width: 220px; margin-bottom: 20px; }
        .gate-btn { background: var(--accent); color: white; border: none; padding: 12px 32px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; border-radius: 4px; }

        #drawing-canvas { position: fixed; top: 0; left: 0; z-index: 1; pointer-events: none; }
        #drawing-canvas.active { pointer-events: all; cursor: crosshair; z-index: 5; }

        #desktop { width: 100vw; height: 100vh; position: relative; display: none; z-index: 10; pointer-events: none; }
        
        #taskbar {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: var(--surface); backdrop-filter: blur(20px);
            padding: 10px 24px; border-radius: 12px;
            display: flex; gap: 12px; align-items: center;
            border: 1px solid var(--border); z-index: 8000; box-shadow: var(--shadow);
            pointer-events: all;
        }

        .item { 
            position: absolute; min-width: 150px; min-height: 100px; 
            z-index: 100; pointer-events: all; display: flex; flex-direction: column;
            box-shadow: var(--shadow); border-radius: 8px; background: var(--surface);
            border: 1px solid var(--border); overflow: hidden;
        }

        .drag-handle { height: 28px; width: 100%; background: rgba(0,0,0,0.04); cursor: move; display: flex; align-items: center; justify-content: center; }
        .drag-handle::after { content: '••••'; color: #999; font-size: 12px; letter-spacing: 2px; }

        .resizer { width: 16px; height: 16px; position: absolute; right: 0; bottom: 0; cursor: nwse-resize; z-index: 110; }
        .resizer::after { content: ''; position: absolute; right: 4px; bottom: 4px; width: 4px; height: 4px; border-right: 2px solid #ccc; border-bottom: 2px solid #ccc; }

        .content-wrap { flex-grow: 1; position: relative; width: 100%; height: 100%; overflow: hidden; display: flex;}
        .item textarea { width: 100%; height: 100%; border: none; resize: none; outline: none; background: transparent; padding: 10px; box-sizing: border-box; font-family: inherit; font-size: 14px; flex-grow: 1;}
        .item img, .item video { width: 100%; height: 100%; object-fit: contain; pointer-events: none; flex-grow: 1;}

        .close-btn { position: absolute; top: 6px; right: 8px; border: none; background: #ff5f56; width: 12px; height: 12px; border-radius: 50%; cursor: pointer; z-index: 120; font-size: 0; }
        
        .tool-btn { background: transparent; border: none; color: var(--text-main); padding: 6px 8px; cursor: pointer; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.5; font-weight: 500; }
        .tool-btn.active { opacity: 1; border-bottom: 2px solid var(--accent); }

        #colorWheel { width: 24px; height: 24px; border: none; padding: 0; background: none; cursor: pointer; border-radius: 50%; overflow: hidden; }
        
        .size-slider { width: 60px; height: 4px; cursor: pointer; accent-color: var(--accent); }
        .slider-label { font-size: 9px; font-weight: 700; opacity: 0.6; }

        .toggle-wrap { display: flex; align-items: center; gap: 4px; cursor: pointer; }
        .toggle-wrap input { cursor: pointer; }
    </style>
</head>
<body>

    <div id="gate">
        <input type="password" id="accessCode" class="gate-input" placeholder="PASSKEY" onkeypress="if(event.key === 'Enter') unlock()">
        <button class="gate-btn" onclick="unlock()">Enter</button>
    </div>

    <canvas id="drawing-canvas"></canvas>

    <div id="desktop">
        <div id="taskbar">
            <button class="tool-btn" onclick="addItem('text')">Text</button>
            <button class="tool-btn" onclick="document.getElementById('fileUp').click()">Media</button>
            
            <div style="border-left: 1px solid var(--border); padding-left: 10px; display: flex; gap: 2px; align-items: center;">
                <button class="tool-btn" onclick="document.getElementById('bgUp').click()">BG</button>
                <button class="tool-btn" onclick="removeBackground()" style="font-size: 8px; color: #888;">RMV BG</button>
            </div>
            
            <div style="border-left: 1px solid var(--border); padding-left: 10px; display: flex; gap: 10px; align-items: center;">
                <button class="tool-btn" onclick="toggleMode('draw')" id="drawBtn">Draw</button>
                <button class="tool-btn" onclick="toggleMode('erase')" id="eraseBtn">Erase</button>
                <input type="color" id="colorWheel" value="#111111" onchange="currentColor = this.value">
                <span class="slider-label">SIZE</span>
                <input type="range" class="size-slider" id="brushSize" min="1" max="50" value="3">
                
                <label class="toggle-wrap">
                    <input type="checkbox" id="pressureToggle">
                    <span style="font-size: 9px; font-weight: 700; opacity: 0.6;">PRESS</span>
                </label>
            </div>

            <div style="border-left: 1px solid var(--border); padding-left: 10px; display: flex; gap: 5px;">
                <button class="tool-btn" onclick="undo()">⟲</button>
                <button class="tool-btn" onclick="redo()">⟳</button>
            </div>

            <button class="tool-btn" onclick="clearAll()" style="color:red; border-left: 1px solid var(--border); padding-left:10px;">Reset</button>
            
            <input type="file" id="fileUp" hidden onchange="uploadMedia(this)">
            <input type="file" id="bgUp" hidden onchange="uploadBackground(this)">
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://YOUR_PROJECT_ID.supabase.co';
        const SUPABASE_KEY = 'YOUR_ANON_KEY';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentCode = "";
        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d');
        const sizeInput = document.getElementById('brushSize');
        const pressureToggle = document.getElementById('pressureToggle');
        
        let isDrawing = false;
        let activeMode = null;
        let currentColor = "#111111";
        let lastX = 0, lastY = 0;
        let history = [];
        let redoStack = [];

        window.unlock = async function() {
            const input = document.getElementById('accessCode').value;
            if (input.length < 2) return;
            currentCode = `studio_${input}`;
            document.getElementById('gate').style.display = "none";
            document.getElementById('desktop').style.display = "block";
            resizeCanvas();
            initialLoad();
            subscribeToChanges();
        };

        function resizeCanvas() {
            const temp = canvas.toDataURL();
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const img = new Image();
            img.onload = () => ctx.drawImage(img, 0, 0);
            img.src = temp;
        }

        function subscribeToChanges() {
            sb.channel('studio_realtime')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'studio_sessions', filter: `id=eq.${currentCode}` }, 
                payload => {
                    renderItems(payload.new.data);
                    renderDrawing(payload.new.drawing);
                    renderBackground(payload.new.background);
                }).subscribe();
        }

        window.pushUpdate = async function() {
            if (!currentCode) return;
            const items = [];
            document.querySelectorAll('.item').forEach(el => {
                const type = el.querySelector('img') ? 'image' : el.querySelector('video') ? 'video' : 'text';
                items.push({
                    type, x: parseInt(el.style.left), y: parseInt(el.style.top),
                    w: parseInt(el.style.width), h: parseInt(el.style.height),
                    val: type === 'text' ? el.querySelector('textarea').value : el.querySelector('img, video').src
                });
            });
            await sb.from('studio_sessions').upsert({ 
                id: currentCode, data: items, drawing: canvas.toDataURL(), background: document.body.style.backgroundImage 
            });
        };

        async function initialLoad() {
            const { data } = await sb.from('studio_sessions').select('*').eq('id', currentCode).single();
            if (data) { 
                renderItems(data.data); renderDrawing(data.drawing); renderBackground(data.background);
                history = [data.drawing || canvas.toDataURL()];
            }
        }

        function renderItems(items) {
            if (!items) return;
            document.querySelectorAll('.item').forEach(el => el.remove());
            items.forEach(i => addItem(i.type, i.val, i.x, i.y, i.w, i.h, false));
        }

        function renderDrawing(drawData) {
            if (!drawData) return;
            const img = new Image();
            img.onload = () => { ctx.clearRect(0,0,canvas.width, canvas.height); ctx.drawImage(img, 0, 0); };
            img.src = drawData;
        }

        function renderBackground(bg) { document.body.style.backgroundImage = bg || ''; }
        window.removeBackground = function() { document.body.style.backgroundImage = ''; pushUpdate(); };

        window.toggleMode = function(mode) {
            activeMode = (activeMode === mode) ? null : mode;
            canvas.classList.toggle('active', !!activeMode);
            document.getElementById('drawBtn').classList.toggle('active', activeMode === 'draw');
            document.getElementById('eraseBtn').classList.toggle('active', activeMode === 'erase');
        };

        window.undo = function() {
            if (history.length <= 1) return;
            redoStack.push(history.pop());
            renderDrawing(history[history.length - 1]);
            pushUpdate();
        };

        window.redo = function() {
            if (redoStack.length === 0) return;
            const state = redoStack.pop();
            history.push(state);
            renderDrawing(state);
            pushUpdate();
        };

        // --- DRAWING WITH PRESSURE ---
        canvas.onpointerdown = (e) => { 
            isDrawing = true; [lastX, lastY] = [e.clientX, e.clientY]; 
        };

        canvas.onpointermove = (e) => {
            if (!isDrawing) return;
            ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(e.clientX, e.clientY);
            
            const baseSize = parseInt(sizeInput.value);
            // Pressure is 0.5 for mouse, 0-1.0 for stylus. 
            // If toggle is off, multiplier is always 1.
            const pressure = pressureToggle.checked ? (e.pressure || 0.5) : 1;
            
            ctx.lineWidth = (activeMode === 'erase' ? baseSize * 2 : baseSize) * pressure;
            ctx.lineCap = "round"; ctx.strokeStyle = currentColor;
            ctx.globalCompositeOperation = activeMode === 'erase' ? "destination-out" : "source-over";
            ctx.stroke(); [lastX, lastY] = [e.clientX, e.clientY];
        };

        canvas.onpointerup = () => { 
            if (!isDrawing) return;
            isDrawing = false; 
            history.push(canvas.toDataURL());
            if (history.length > 30) history.shift();
            redoStack = []; pushUpdate(); 
        };

        window.addItem = function(type, val = '', x = 100, y = 100, w = 300, h = 200, shouldPush = true) {
            const div = document.createElement('div');
            div.className = 'item';
            div.style.left = x + 'px'; div.style.top = y + 'px';
            div.style.width = w + 'px'; div.style.height = h + 'px';
            const handle = document.createElement('div'); handle.className = 'drag-handle';
            const close = document.createElement('button'); close.className = 'close-btn';
            close.onclick = () => { div.remove(); pushUpdate(); };
            const contentWrap = document.createElement('div'); contentWrap.className = 'content-wrap';
            let content;
            if (type === 'text') {
                content = document.createElement('textarea'); content.value = val;
                content.onblur = pushUpdate;
            } else {
                content = document.createElement(type === 'video' ? 'video' : 'img');
                content.src = val; if(type === 'video') content.controls = true;
            }
            const resizer = document.createElement('div'); resizer.className = 'resizer';
            contentWrap.appendChild(content); div.appendChild(handle); div.appendChild(close);
            div.appendChild(contentWrap); div.appendChild(resizer);
            document.getElementById('desktop').appendChild(div);
            setupInteraction(div, handle, resizer);
            if(shouldPush) pushUpdate();
        };

        function setupInteraction(item, handle, resizer) {
            handle.onpointerdown = (e) => {
                if(activeMode) toggleMode(activeMode);
                let startX = e.clientX - item.offsetLeft, startY = e.clientY - item.offsetTop;
                document.onpointermove = (m) => { item.style.left = (m.clientX - startX) + 'px'; item.style.top = (m.clientY - startY) + 'px'; };
                document.onpointerup = () => { document.onpointermove = null; pushUpdate(); };
            };
            resizer.onpointerdown = (e) => {
                e.preventDefault(); e.stopPropagation();
                let startW = item.offsetWidth, startH = item.offsetHeight, startX = e.clientX, startY = e.clientY;
                document.onpointermove = (m) => {
                    item.style.width = Math.max(100, (startW + (m.clientX - startX))) + 'px';
                    item.style.height = Math.max(80, (startH + (m.clientY - startY))) + 'px';
                };
                document.onpointerup = () => { document.onpointermove = null; pushUpdate(); };
            };
        }

        window.uploadMedia = function(input) {
            const file = input.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => addItem(file.type.startsWith('image') ? 'image' : 'video', e.target.result);
            reader.readAsDataURL(file);
        };

        window.uploadBackground = function(input) {
            const file = input.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => { document.body.style.backgroundImage = `url('${e.target.result}')`; pushUpdate(); };
            reader.readAsDataURL(file);
        };

        window.clearAll = async function() { 
            if(confirm("Erase Everything?")) { 
                await sb.from('studio_sessions').delete().eq('id', currentCode);
                location.reload();
            } 
        };
        window.onresize = resizeCanvas;
    </script>
</body>
</html>
