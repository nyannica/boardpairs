<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Studio Duo | Advanced Live</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-base: #f8f9fa;
            --surface: rgba(255, 255, 255, 0.95);
            --accent: #000000;
            --text-main: #1a1a1a;
            --border: rgba(0, 0, 0, 0.08);
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
        }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-base); background-size: cover; background-position: center;
            color: var(--text-main); overflow: hidden; touch-action: none;
        }

        /* --- Sleek Entry Gate --- */
        #gate { 
            position: fixed; inset: 0; 
            background: radial-gradient(circle at center, #ffffff 0%, #f0f0f0 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            z-index: 9999; transition: opacity 0.6s ease, visibility 0.6s;
        }
        .gate-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            padding: 40px; border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.4);
            box-shadow: 0 30px 60px rgba(0,0,0,0.1);
            text-align: center; width: 100%; max-width: 320px;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .gate-title { font-size: 14px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 30px; opacity: 0.8; }
        .gate-input { 
            background: rgba(0,0,0,0.03); border: 1px solid var(--border); 
            color: var(--text-main); font-size: 16px; text-align: center; 
            outline: none; padding: 15px; border-radius: 12px; width: 100%; 
            box-sizing: border-box; margin-bottom: 15px; transition: all 0.3s;
        }
        .gate-input:focus { background: #fff; border-color: #000; box-shadow: 0 0 0 4px rgba(0,0,0,0.05); }
        .gate-btn { 
            background: var(--accent); color: white; border: none; width: 100%;
            padding: 15px; font-size: 12px; font-weight: 600; text-transform: uppercase; 
            letter-spacing: 2px; cursor: pointer; border-radius: 12px; transition: transform 0.2s;
        }
        .gate-btn:hover { transform: scale(1.02); }

        /* --- Workspace --- */
        #drawing-canvas { position: fixed; top: 0; left: 0; z-index: 1; pointer-events: none; }
        #drawing-canvas.active { pointer-events: all; cursor: crosshair; z-index: 5; }
        #desktop { width: 100vw; height: 100vh; position: relative; display: none; z-index: 10; pointer-events: none; }
        
        #taskbar {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: var(--surface); backdrop-filter: blur(20px);
            padding: 8px 20px; border-radius: 16px;
            display: flex; gap: 12px; align-items: center;
            border: 1px solid var(--border); z-index: 8000; box-shadow: var(--shadow);
            pointer-events: all;
        }

        .item { 
            position: absolute; min-width: 150px; min-height: 100px; 
            z-index: 100; pointer-events: all; display: flex; flex-direction: column;
            box-shadow: var(--shadow); border-radius: 12px; background: var(--surface);
            border: 1px solid var(--border); overflow: hidden;
        }
        .drag-handle { height: 30px; width: 100%; background: rgba(0,0,0,0.02); cursor: move; display: flex; align-items: center; justify-content: center; }
        .drag-handle::after { content: '•••'; color: #ccc; font-size: 14px; letter-spacing: 2px; }

        .resizer { width: 16px; height: 16px; position: absolute; right: 0; bottom: 0; cursor: nwse-resize; z-index: 110; }
        .content-wrap { flex-grow: 1; position: relative; width: 100%; height: 100%; overflow: hidden; display: flex;}
        .item textarea { width: 100%; height: 100%; border: none; resize: none; outline: none; background: transparent; padding: 12px; box-sizing: border-box; font-family: inherit; font-size: 14px; }
        .item img, .item video { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
        .close-btn { position: absolute; top: 8px; right: 10px; border: none; background: #ff5f56; width: 12px; height: 12px; border-radius: 50%; cursor: pointer; z-index: 120; }
        
        .tool-btn { background: transparent; border: none; color: var(--text-main); padding: 8px 10px; cursor: pointer; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.4; font-weight: 600; transition: opacity 0.2s; }
        .tool-btn:hover { opacity: 1; }
        .tool-btn.active { opacity: 1; }

        #colorWheel { width: 22px; height: 22px; border: 1px solid var(--border); padding: 0; background: none; cursor: pointer; border-radius: 50%; overflow: hidden; }
        .size-slider { width: 80px; height: 4px; cursor: pointer; accent-color: var(--accent); }
        .slider-label { font-size: 9px; font-weight: 800; opacity: 0.5; letter-spacing: 1px; }

        .toggle-wrap { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 9px; font-weight: 800; opacity: 0.5; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div id="gate">
        <div class="gate-card">
            <div class="gate-title">Studio Duo</div>
            <input type="password" id="accessCode" class="gate-input" placeholder="Passkey" onkeypress="if(event.key === 'Enter') unlock()">
            <button class="gate-btn" onclick="unlock()">Access Workspace</button>
        </div>
    </div>

    <canvas id="drawing-canvas"></canvas>

    <div id="desktop">
        <div id="taskbar">
            <button class="tool-btn" onclick="addItem('text')">Text</button>
            <button class="tool-btn" onclick="document.getElementById('fileUp').click()">Media</button>
            
            <div style="border-left: 1px solid var(--border); padding-left: 12px; display: flex; gap: 4px; align-items: center;">
                <button class="tool-btn" onclick="document.getElementById('bgUp').click()">BG</button>
                <button class="tool-btn" onclick="removeBackground()" style="font-size: 8px; color: #999;">Clear</button>
            </div>
            
            <div style="border-left: 1px solid var(--border); padding-left: 12px; display: flex; gap: 12px; align-items: center;">
                <button class="tool-btn" onclick="toggleMode('draw')" id="drawBtn">Draw</button>
                <button class="tool-btn" onclick="toggleMode('erase')" id="eraseBtn">Erase</button>
                <input type="color" id="colorWheel" value="#111111" onchange="currentColor = this.value">
                <span class="slider-label">SIZE</span>
                <input type="range" class="size-slider" id="brushSize" min="1" max="60" value="4">
                
                <label class="toggle-wrap">
                    <input type="checkbox" id="pressureToggle" checked>
                    <span>PRESSURE</span>
                </label>
            </div>

            <div style="border-left: 1px solid var(--border); padding-left: 12px; display: flex; gap: 8px;">
                <button class="tool-btn" onclick="undo()">⟲</button>
                <button class="tool-btn" onclick="redo()">⟳</button>
            </div>

            <button class="tool-btn" onclick="clearAll()" style="color:#ff3b30; border-left: 1px solid var(--border); padding-left:12px;">Reset</button>
            
            <input type="file" id="fileUp" hidden onchange="uploadMedia(this)">
            <input type="file" id="bgUp" hidden onchange="uploadBackground(this)">
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://djpcwjjjjwbpsvuqmxxt.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqcGN3ampqandicHN2dXFteHh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExNzM4MzMsImV4cCI6MjA4Njc0OTgzM30.jSRjuVf2tcGHg1QceEquaE146e2FNaoNBnyjJ36_IZI';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentCode = "";
        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d');
        const sizeInput = document.getElementById('brushSize');
        const pressureToggle = document.getElementById('pressureToggle');
        
        let isDrawing = false;
        let activeMode = null;
        let currentColor = "#111111";
        let lastX = 0, lastY = 0;
        let history = [];
        let redoStack = [];

        // Pressure smoothing variables
        let smoothPressure = 1;
        const pressureSmoothingFactor = 0.15; // Lower is smoother/slower, higher is more responsive

        window.unlock = async function() {
            const input = document.getElementById('accessCode').value;
            if (input.length < 2) return;
            currentCode = `studio_${input}`;
            const gate = document.getElementById('gate');
            gate.style.opacity = '0';
            setTimeout(() => { gate.style.visibility = 'hidden'; }, 600);
            document.getElementById('desktop').style.display = "block";
            resizeCanvas();
            initialLoad();
            subscribeToChanges();
        };

        function resizeCanvas() {
            const temp = canvas.toDataURL();
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const img = new Image();
            img.onload = () => ctx.drawImage(img, 0, 0);
            img.src = temp;
        }

        // --- DRAWING WITH SMOOTH PRESSURE ---
        canvas.onpointerdown = (e) => { 
            if (!activeMode) return;
            isDrawing = true; 
            [lastX, lastY] = [e.clientX, e.clientY]; 
            smoothPressure = e.pressure || 0.5; // Start with initial pressure
        };

        canvas.onpointermove = (e) => {
            if (!isDrawing) return;
            
            ctx.beginPath(); 
            ctx.moveTo(lastX, lastY); 
            ctx.lineTo(e.clientX, e.clientY);
            
            const baseSize = parseInt(sizeInput.value);
            
            if (pressureToggle.checked && e.pointerType === 'pen') {
                // Low-pass filter for pressure smoothing
                const currentPressure = e.pressure || 0.5;
                smoothPressure = smoothPressure + (currentPressure - smoothPressure) * pressureSmoothingFactor;
            } else {
                smoothPressure = 1;
            }
            
            ctx.lineWidth = (activeMode === 'erase' ? baseSize * 3 : baseSize) * smoothPressure;
            ctx.lineCap = "round"; 
            ctx.lineJoin = "round";
            ctx.strokeStyle = currentColor;
            ctx.globalCompositeOperation = activeMode === 'erase' ? "destination-out" : "source-over";
            
            ctx.stroke(); 
            [lastX, lastY] = [e.clientX, e.clientY];
        };

        canvas.onpointerup = () => { 
            if (!isDrawing) return;
            isDrawing = false; 
            history.push(canvas.toDataURL());
            if (history.length > 30) history.shift();
            redoStack = []; 
            pushUpdate(); 
        };

        // --- Standard Logic ---
        window.toggleMode = function(mode) {
            activeMode = (activeMode === mode) ? null : mode;
            canvas.classList.toggle('active', !!activeMode);
            document.getElementById('drawBtn').classList.toggle('active', activeMode === 'draw');
            document.getElementById('eraseBtn').classList.toggle('active', activeMode === 'erase');
        };

        window.addItem = function(type, val = '', x = 100, y = 100, w = 300, h = 200, shouldPush = true) {
            const div = document.createElement('div');
            div.className = 'item';
            div.style.left = x + 'px'; div.style.top = y + 'px';
            div.style.width = w + 'px'; div.style.height = h + 'px';
            const handle = document.createElement('div'); handle.className = 'drag-handle';
            const close = document.createElement('button'); close.className = 'close-btn';
            close.onclick = () => { div.remove(); pushUpdate(); };
            const contentWrap = document.createElement('div'); contentWrap.className = 'content-wrap';
            let content;
            if (type === 'text') {
                content = document.createElement('textarea'); content.value = val;
                content.onblur = pushUpdate;
            } else {
                content = document.createElement(type === 'video' ? 'video' : 'img');
                content.src = val; if(type === 'video') content.controls = true;
            }
            const resizer = document.createElement('div'); resizer.className = 'resizer';
            contentWrap.appendChild(content); div.appendChild(handle); div.appendChild(close);
            div.appendChild(contentWrap); div.appendChild(resizer);
            document.getElementById('desktop').appendChild(div);
            setupInteraction(div, handle, resizer);
            if(shouldPush) pushUpdate();
        };

        function setupInteraction(item, handle, resizer) {
            handle.onpointerdown = (e) => {
                if(activeMode) toggleMode(activeMode);
                item.style.zIndex = 1000;
                let startX = e.clientX - item.offsetLeft, startY = e.clientY - item.offsetTop;
                document.onpointermove = (m) => { item.style.left = (m.clientX - startX) + 'px'; item.style.top = (m.clientY - startY) + 'px'; };
                document.onpointerup = () => { document.onpointermove = null; item.style.zIndex = 100; pushUpdate(); };
            };
            resizer.onpointerdown = (e) => {
                e.preventDefault(); e.stopPropagation();
                let startW = item.offsetWidth, startH = item.offsetHeight, startX = e.clientX, startY = e.clientY;
                document.onpointermove = (m) => {
                    item.style.width = Math.max(100, (startW + (m.clientX - startX))) + 'px';
                    item.style.height = Math.max(80, (startH + (m.clientY - startY))) + 'px';
                };
                document.onpointerup = () => { document.onpointermove = null; pushUpdate(); };
            };
        }

        // --- Sync Functions (Supabase) ---
        window.pushUpdate = async function() {
            if (!currentCode) return;
            const items = [];
            document.querySelectorAll('.item').forEach(el => {
                const type = el.querySelector('img') ? 'image' : el.querySelector('video') ? 'video' : 'text';
                items.push({
                    type, x: parseInt(el.style.left), y: parseInt(el.style.top),
                    w: parseInt(el.style.width), h: parseInt(el.style.height),
                    val: type === 'text' ? el.querySelector('textarea').value : el.querySelector('img, video').src
                });
            });
            await sb.from('studio_sessions').upsert({ id: currentCode, data: items, drawing: canvas.toDataURL(), background: document.body.style.backgroundImage });
        };

        async function initialLoad() {
            const { data } = await sb.from('studio_sessions').select('*').eq('id', currentCode).single();
            if (data) { 
                renderItems(data.data); renderDrawing(data.drawing); 
                document.body.style.backgroundImage = data.background || '';
                history = [data.drawing || canvas.toDataURL()];
            }
        }

        function renderItems(items) {
            if (!items) return;
            document.querySelectorAll('.item').forEach(el => el.remove());
            items.forEach(i => addItem(i.type, i.val, i.x, i.y, i.w, i.h, false));
        }

        function renderDrawing(drawData) {
            if (!drawData) return;
            const img = new Image();
            img.onload = () => { ctx.clearRect(0,0,canvas.width, canvas.height); ctx.drawImage(img, 0, 0); };
            img.src = drawData;
        }

        function subscribeToChanges() {
            sb.channel('studio_realtime')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'studio_sessions', filter: `id=eq.${currentCode}` }, 
                payload => {
                    renderItems(payload.new.data);
                    renderDrawing(payload.new.drawing);
                    document.body.style.backgroundImage = payload.new.background || '';
                }).subscribe();
        }

        window.uploadMedia = function(input) {
            const file = input.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => addItem(file.type.startsWith('image') ? 'image' : 'video', e.target.result);
            reader.readAsDataURL(file);
        };

        window.uploadBackground = function(input) {
            const file = input.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => { document.body.style.backgroundImage = `url('${e.target.result}')`; pushUpdate(); };
            reader.readAsDataURL(file);
        };

        window.removeBackground = function() { document.body.style.backgroundImage = ''; pushUpdate(); };
        window.clearAll = async function() { if(confirm("Erase Everything?")) { await sb.from('studio_sessions').delete().eq('id', currentCode); location.reload(); } };
        window.undo = function() { if (history.length <= 1) return; redoStack.push(history.pop()); renderDrawing(history[history.length - 1]); pushUpdate(); };
        window.redo = function() { if (redoStack.length === 0) return; const state = redoStack.pop(); history.push(state); renderDrawing(state); pushUpdate(); };
        window.onresize = resizeCanvas;
    </script>
</body>
</html>
