<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Studio Duo | Mobile Live</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-base: #fcfcfc;
            --surface: rgba(255, 255, 255, 0.95);
            --accent: #111111;
            --text-main: #222222;
            --border: rgba(0, 0, 0, 0.1);
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            --safe-top: env(safe-area-inset-top);
        }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main); overflow: hidden; 
            touch-action: none; /* Critical for drawing performance */
        }

        /* Access Gate - Mobile Friendly */
        #gate { position: fixed; inset: 0; background: var(--bg-base); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .gate-input { background: transparent; border: none; border-bottom: 2px solid var(--border); color: var(--text-main); font-size: 24px; text-align: center; outline: none; padding: 15px; width: 80%; max-width: 300px; margin-bottom: 30px; }
        .gate-btn { background: var(--accent); color: white; border: none; padding: 16px 40px; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; border-radius: 50px; width: 200px; }

        #drawing-canvas { position: fixed; top: 0; left: 0; z-index: 1; pointer-events: none; }
        #drawing-canvas.active { pointer-events: all; z-index: 5; }

        #desktop { width: 100vw; height: 100vh; position: relative; display: none; z-index: 10; }
        
        /* Responsive Taskbar */
        #taskbar {
            position: fixed; 
            bottom: 20px; /* Moved to bottom for thumb reach */
            left: 50%; transform: translateX(-50%);
            background: var(--surface); backdrop-filter: blur(15px);
            padding: 8px; border-radius: 20px;
            display: flex; gap: 8px; align-items: center;
            border: 1px solid var(--border); z-index: 8000; box-shadow: var(--shadow);
            max-width: 95vw; overflow-x: auto;
            scrollbar-width: none; /* Hide scrollbar for clean look */
        }
        #taskbar::-webkit-scrollbar { display: none; }

        .tool-btn { 
            background: #eee; border: none; color: var(--text-main); 
            padding: 10px 14px; border-radius: 12px;
            cursor: pointer; font-size: 10px; text-transform: uppercase; 
            font-weight: 700; white-space: nowrap;
            transition: all 0.2s;
        }
        .tool-btn.active { background: var(--accent); color: white; }

        /* Mobile Item Adjustments */
        .item { 
            position: absolute; min-width: 120px; min-height: 80px; 
            z-index: 100; pointer-events: all; display: flex; flex-direction: column;
            box-shadow: var(--shadow); border-radius: 12px; background: var(--surface);
            border: 1px solid var(--border); overflow: hidden;
            touch-action: none;
        }

        .drag-handle { height: 35px; width: 100%; background: rgba(0,0,0,0.03); cursor: move; display: flex; align-items: center; justify-content: center; }
        .drag-handle::after { content: '•••'; color: #bbb; letter-spacing: 3px; }

        .resizer { width: 30px; height: 30px; position: absolute; right: 0; bottom: 0; cursor: nwse-resize; z-index: 110; }
        .resizer::after { content: '⌟'; position: absolute; right: 5px; bottom: 5px; font-size: 20px; color: #ccc; }

        .content-wrap { flex-grow: 1; position: relative; width: 100%; height: 100%; overflow: hidden; display: flex;}
        .item textarea { width: 100%; height: 100%; border: none; resize: none; outline: none; background: transparent; padding: 12px; font-size: 16px; } /* 16px prevents iOS zoom */
        
        .close-btn { position: absolute; top: 8px; left: 8px; border: none; background: #ff5f56; width: 18px; height: 18px; border-radius: 50%; z-index: 120; }
        
        #colorWheel { width: 30px; height: 30px; border: none; border-radius: 50%; appearance: none; -webkit-appearance: none; background: none; }
        
        /* Floating Controls for Brush */
        .brush-controls {
            position: fixed; top: calc(var(--safe-top) + 10px); right: 10px;
            background: var(--surface); padding: 10px; border-radius: 15px;
            display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--border);
            z-index: 8000;
        }
    </style>
</head>
<body>

    <div id="gate">
        <h2 style="font-weight: 300; letter-spacing: 4px;">STUDIO DUO</h2>
        <input type="password" id="accessCode" class="gate-input" placeholder="PASSKEY" inputmode="numeric">
        <button class="gate-btn" onclick="unlock()">Enter</button>
    </div>

    <canvas id="drawing-canvas"></canvas>

    <div id="desktop">
        <div class="brush-controls">
            <input type="color" id="colorWheel" value="#111111" onchange="currentColor = this.value">
            <input type="range" id="brushSize" min="1" max="50" value="5" style="writing-mode: bt-lr; -webkit-appearance: slider-vertical; width: 8px; height: 100px;">
        </div>

        <div id="taskbar">
            <button class="tool-btn" onclick="addItem('text')">Text</button>
            <button class="tool-btn" onclick="document.getElementById('fileUp').click()">Media</button>
            <button class="tool-btn" onclick="toggleMode('draw')" id="drawBtn">Draw</button>
            <button class="tool-btn" onclick="toggleMode('erase')" id="eraseBtn">Erase</button>
            <button class="tool-btn" onclick="undo()">⟲</button>
            <button class="tool-btn" onclick="clearAll()" style="color:#ff5f56;">Reset</button>
            
            <input type="file" id="fileUp" hidden onchange="uploadMedia(this)" accept="image/*,video/*">
        </div>
    </div>

    <script>
        // ... (Keep your Supabase config here) ...
        const SUPABASE_URL = 'https://djpcwjjjjwbpsvuqmxxt.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqcGN3ampqandicHN2dXFteHh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExNzM4MzMsImV4cCI6MjA4Njc0OTgzM30.jSRjuVf2tcGHg1QceEquaE146e2FNaoNBnyjJ36_IZI';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentCode = "";
        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d');
        const sizeInput = document.getElementById('brushSize');
        
        let isDrawing = false;
        let activeMode = null;
        let currentColor = "#111111";
        let lastX = 0, lastY = 0;
        let history = [];
        let redoStack = [];

        window.unlock = async function() {
            const input = document.getElementById('accessCode').value;
            if (input.length < 2) return;
            currentCode = `studio_${input}`;
            document.getElementById('gate').style.display = "none";
            document.getElementById('desktop').style.display = "block";
            
            // Request fullscreen for better mobile experience
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
            
            resizeCanvas();
            initialLoad();
            subscribeToChanges();
        };

        function resizeCanvas() {
            const temp = canvas.toDataURL();
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const img = new Image();
            img.onload = () => ctx.drawImage(img, 0, 0);
            img.src = temp;
        }

        window.toggleMode = function(mode) {
            activeMode = (activeMode === mode) ? null : mode;
            canvas.classList.toggle('active', !!activeMode);
            document.getElementById('drawBtn').classList.toggle('active', activeMode === 'draw');
            document.getElementById('eraseBtn').classList.toggle('active', activeMode === 'erase');
        };

        // --- ENHANCED TOUCH DRAWING ---
        canvas.addEventListener('pointerdown', (e) => {
            if (!activeMode) return;
            isDrawing = true;
            [lastX, lastY] = [e.clientX, e.clientY];
        }, { passive: false });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDrawing) return;
            e.preventDefault(); // Prevents scrolling while drawing
            
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(e.clientX, e.clientY);
            
            const baseSize = parseInt(sizeInput.value);
            // Auto-detect pressure for stylus, fallback for touch
            const pressure = e.pressure > 0 ? e.pressure : 0.8;
            
            ctx.lineWidth = (activeMode === 'erase' ? baseSize * 2 : baseSize) * pressure;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.strokeStyle = currentColor;
            ctx.globalCompositeOperation = activeMode === 'erase' ? "destination-out" : "source-over";
            ctx.stroke();
            
            [lastX, lastY] = [e.clientX, e.clientY];
        }, { passive: false });

        canvas.addEventListener('pointerup', () => {
            if (!isDrawing) return;
            isDrawing = false;
            pushUpdate();
        });

        // --- TOUCH-FRIENDLY INTERACTIONS ---
        function setupInteraction(item, handle, resizer) {
            // Dragging
            handle.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                if(activeMode) toggleMode(null);
                let startX = e.clientX - item.offsetLeft;
                let startY = e.clientY - item.offsetTop;
                
                const move = (m) => {
                    item.style.left = (m.clientX - startX) + 'px';
                    item.style.top = (m.clientY - startY) + 'px';
                };
                
                const up = () => {
                    window.removeEventListener('pointermove', move);
                    window.removeEventListener('pointerup', up);
                    pushUpdate();
                };
                
                window.addEventListener('pointermove', move);
                window.addEventListener('pointerup', up);
            });

            // Resizing
            resizer.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                let startW = item.offsetWidth;
                let startH = item.offsetHeight;
                let startX = e.clientX;
                let startY = e.clientY;

                const move = (m) => {
                    item.style.width = Math.max(120, (startW + (m.clientX - startX))) + 'px';
                    item.style.height = Math.max(80, (startH + (m.clientY - startY))) + 'px';
                };

                const up = () => {
                    window.removeEventListener('pointermove', move);
                    window.removeEventListener('pointerup', up);
                    pushUpdate();
                };

                window.addEventListener('pointermove', move);
                window.addEventListener('pointerup', up);
            });
        }

        // ... (Keep renderItems, uploadMedia, and clearAll logic from your original script) ...
        // Note: Ensure addItem calls setupInteraction() as in your original code.
        
        window.onresize = resizeCanvas;
        window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));
    </script>
</body>
</html>
