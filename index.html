<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Studio Duo | Advanced Live</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-base: #fcfcfc;
            --surface: rgba(255, 255, 255, 0.95);
            --accent: #111111;
            --text-main: #222222;
            --border: rgba(0, 0, 0, 0.1);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            overflow: hidden;
            overscroll-behavior: none; 
            touch-action: none;
            background-size: cover;
            background-position: center;
            /* Ensure the background stays behind everything */
            z-index: -1;
        }

        /* --- Access Gate --- */
        #gate { 
            position: fixed; inset: 0; 
            background: var(--bg-base); 
            display: flex; flex-direction: column; 
            align-items: center; justify-content: center; 
            z-index: 9999; padding: 20px;
        }

        /* --- Canvas Layer (Mid Layer) --- */
        #drawing-canvas { 
            position: fixed; top: 0; left: 0; 
            z-index: 10; 
            pointer-events: none; 
        }
        #drawing-canvas.active { 
            pointer-events: all; 
            cursor: crosshair; 
        }

        /* --- UI Layer (Top Layer) --- */
        #desktop { 
            position: fixed; inset: 0;
            z-index: 100; 
            pointer-events: none; /* Allows drawing through the desktop div */
        }
        
        #taskbar {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            width: auto; max-width: 95%;
            background: var(--surface); backdrop-filter: blur(20px);
            padding: 8px 18px; border-radius: 16px;
            display: flex; gap: 8px; align-items: center;
            border: 1px solid var(--border); 
            box-shadow: var(--shadow);
            overflow-x: auto; scrollbar-width: none;
            pointer-events: all; /* Important: keeps buttons clickable */
        }
        #taskbar::-webkit-scrollbar { display: none; }

        /* --- Item Styling --- */
        .item { 
            position: absolute; min-width: 120px; min-height: 80px; 
            z-index: 200; pointer-events: all; 
            display: flex; flex-direction: column;
            box-shadow: var(--shadow); border-radius: 12px; background: var(--surface);
            border: 1px solid var(--border); overflow: hidden; touch-action: none;
        }
        .drag-handle { height: 32px; width: 100%; background: rgba(0,0,0,0.03); cursor: move; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .content-wrap { flex-grow: 1; position: relative; width: 100%; overflow: hidden; display: flex; }
        .item textarea { width: 100%; height: 100%; border: none; resize: none; outline: none; background: transparent; padding: 12px; box-sizing: border-box; font-size: 14px; flex-grow: 1; }
        .item img, .item video { width: 100%; height: 100%; object-fit: contain; pointer-events: none; flex-grow: 1; }
        .close-btn { position: absolute; top: 8px; right: 8px; border: none; background: #ff5f56; width: 14px; height: 14px; border-radius: 50%; cursor: pointer; z-index: 220; }
        .resizer { width: 24px; height: 24px; position: absolute; right: 0; bottom: 0; cursor: nwse-resize; z-index: 210; }

        /* --- Controls --- */
        .tool-btn { 
            white-space: nowrap; background: transparent; border: none; color: var(--text-main); 
            padding: 8px 10px; cursor: pointer; font-size: 10px; font-weight: 700; 
            text-transform: uppercase; opacity: 0.5; transition: 0.2s;
        }
        .tool-btn.active { opacity: 1; color: #000; background: rgba(0,0,0,0.05); border-radius: 8px; }

        /* --- Mobile Adaptations --- */
        @media (max-width: 600px) {
            #taskbar { top: auto; bottom: 20px; padding: 10px; border-radius: 20px; gap: 4px; }
            .tool-btn { padding: 8px 6px; font-size: 9px; }
        }
    </style>
</head>
<body>

    <div id="gate">
        <input type="password" id="accessCode" class="gate-input" placeholder="PASSKEY" onkeypress="if(event.key === 'Enter') unlock()">
        <button class="gate-btn" onclick="unlock()">Enter</button>
    </div>

    <canvas id="drawing-canvas"></canvas>

    <div id="desktop">
        <div id="taskbar">
            <button class="tool-btn" onclick="addItem('text')">Text</button>
            <button class="tool-btn" onclick="document.getElementById('fileUp').click()">Media</button>
            
            <div style="border-left: 1px solid var(--border); padding-left: 8px; display: flex; gap: 4px; align-items: center;">
                <button class="tool-btn" onclick="document.getElementById('bgUp').click()">BG</button>
                <button class="tool-btn" onclick="removeBackground()" style="font-size: 8px; color: #888;">Clear</button>
            </div>
            
            <div style="border-left: 1px solid var(--border); padding-left: 8px; display: flex; gap: 8px; align-items: center;">
                <button class="tool-btn" onclick="toggleMode('draw')" id="drawBtn">Draw</button>
                <button class="tool-btn" onclick="toggleMode('erase')" id="eraseBtn">Eraser</button>
                <input type="color" id="colorWheel" value="#111111" onchange="currentColor = this.value">
                <input type="range" style="width:50px;" id="brushSize" min="1" max="50" value="3">
            </div>

            <div style="border-left: 1px solid var(--border); padding-left: 8px; display: flex; gap: 2px;">
                <button class="tool-btn" onclick="undo()">⟲</button>
                <button class="tool-btn" onclick="redo()">⟳</button>
            </div>

            <button class="tool-btn" onclick="clearAll()" style="color:red; border-left: 1px solid var(--border); padding-left:8px;">Reset</button>
            
            <input type="file" id="fileUp" hidden onchange="uploadMedia(this)">
            <input type="file" id="bgUp" hidden onchange="uploadBackground(this)">
        </div>
    </div>

    <script>
        // Use your Supabase keys here
        const SUPABASE_URL = 'https://djpcwjjjjwbpsvuqmxxt.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqcGN3ampqandicHN2dXFteHh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExNzM4MzMsImV4cCI6MjA4Njc0OTgzM30.jSRjuVf2tcGHg1QceEquaE146e2FNaoNBnyjJ36_IZI';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentCode = "";
        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d');
        const sizeInput = document.getElementById('brushSize');
        
        let isDrawing = false;
        let activeMode = null;
        let currentColor = "#111111";
        let lastX = 0, lastY = 0;
        let history = [];
        let redoStack = [];

        window.unlock = async function() {
            const input = document.getElementById('accessCode').value;
            if (input.length < 2) return;
            currentCode = `studio_${input}`;
            document.getElementById('gate').style.display = "none";
            document.getElementById('desktop').style.display = "block";
            resizeCanvas();
            initialLoad();
            subscribeToChanges();
        };

        function resizeCanvas() {
            const temp = canvas.toDataURL();
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const img = new Image();
            img.onload = () => ctx.drawImage(img, 0, 0);
            img.src = temp;
        }

        window.addEventListener('resize', () => {
            clearTimeout(window.resizerTimer);
            window.resizerTimer = setTimeout(resizeCanvas, 200);
        });

        // --- Drawing ---
        window.toggleMode = function(mode) {
            activeMode = (activeMode === mode) ? null : mode;
            canvas.classList.toggle('active', !!activeMode);
            document.getElementById('drawBtn').classList.toggle('active', activeMode === 'draw');
            document.getElementById('eraseBtn').classList.toggle('active', activeMode === 'erase');
        };

        canvas.onpointerdown = (e) => { 
            if(!activeMode) return;
            isDrawing = true; [lastX, lastY] = [e.clientX, e.clientY]; 
        };

        canvas.onpointermove = (e) => {
            if (!isDrawing) return;
            ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(e.clientX, e.clientY);
            ctx.lineWidth = (activeMode === 'erase' ? sizeInput.value * 4 : sizeInput.value);
            ctx.lineCap = "round"; ctx.lineJoin = "round";
            ctx.strokeStyle = currentColor;
            ctx.globalCompositeOperation = activeMode === 'erase' ? "destination-out" : "source-over";
            ctx.stroke(); [lastX, lastY] = [e.clientX, e.clientY];
        };

        canvas.onpointerup = () => { 
            if (!isDrawing) return;
            isDrawing = false; 
            history.push(canvas.toDataURL());
            pushUpdate(); 
        };

        // --- Logic (AddItem, Sync, etc) ---
        window.addItem = function(type, val = '', x = 100, y = 150, w = 280, h = 180, shouldPush = true) {
            const div = document.createElement('div');
            div.className = 'item';
            div.style.left = x + 'px'; div.style.top = y + 'px';
            div.style.width = w + 'px'; div.style.height = h + 'px';
            
            const handle = document.createElement('div'); handle.className = 'drag-handle';
            handle.innerHTML = "••••";
            const close = document.createElement('button'); close.className = 'close-btn';
            close.onclick = () => { div.remove(); pushUpdate(); };
            
            const contentWrap = document.createElement('div'); contentWrap.className = 'content-wrap';
            let content = type === 'text' ? document.createElement('textarea') : document.createElement(type === 'video' ? 'video' : 'img');
            if (type === 'text') { content.value = val; content.onblur = pushUpdate; } 
            else { content.src = val; if(type === 'video') content.controls = true; }
            
            const resizer = document.createElement('div'); resizer.className = 'resizer';
            contentWrap.appendChild(content); div.appendChild(handle); div.appendChild(close);
            div.appendChild(contentWrap); div.appendChild(resizer);
            document.getElementById('desktop').appendChild(div);
            
            setupInteraction(div, handle, resizer);
            if(shouldPush) pushUpdate();
        };

        function setupInteraction(item, handle, resizer) {
            handle.onpointerdown = (e) => {
                e.preventDefault();
                document.querySelectorAll('.item').forEach(i => i.style.zIndex = 200);
                item.style.zIndex = 300;
                let startX = e.clientX - item.offsetLeft, startY = e.clientY - item.offsetTop;
                const move = (m) => { item.style.left = (m.clientX - startX) + 'px'; item.style.top = (m.clientY - startY) + 'px'; };
                const stop = () => { document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', stop); pushUpdate(); };
                document.addEventListener('pointermove', move);
                document.addEventListener('pointerup', stop);
            };
            resizer.onpointerdown = (e) => {
                e.preventDefault(); e.stopPropagation();
                let startW = item.offsetWidth, startH = item.offsetHeight, startX = e.clientX, startY = e.clientY;
                const move = (m) => {
                    item.style.width = Math.max(100, (startW + (m.clientX - startX))) + 'px';
                    item.style.height = Math.max(80, (startH + (m.clientY - startY))) + 'px';
                };
                const stop = () => { document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', stop); pushUpdate(); };
                document.addEventListener('pointermove', move);
                document.addEventListener('pointerup', stop);
            };
        }

        // Standard helpers for BG and sync...
        window.uploadBackground = function(input) {
            const file = input.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => { document.body.style.backgroundImage = `url('${e.target.result}')`; pushUpdate(); };
            reader.readAsDataURL(file);
        };
        window.removeBackground = function() { document.body.style.backgroundImage = ''; pushUpdate(); };
        window.pushUpdate = async function() { /* Standard Supabase Update Logic */ };
        async function initialLoad() { /* Standard Supabase Load Logic */ }
        function subscribeToChanges() { /* Standard Supabase Realtime Logic */ }
        window.clearAll = () => { if(confirm("Reset everything?")) location.reload(); };
        window.undo = () => { /* Standard Undo */ };
        window.redo = () => { /* Standard Redo */ };
    </script>
</body>
</html>
